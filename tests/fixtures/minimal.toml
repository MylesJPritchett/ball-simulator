# The smallest possible Scenario: one ball bouncing in a circular Arena,
# a note on every Boundary Hit, ending at the time cap. A test fixture, not a
# Video: the Quality Gate rejects every Seed, since its End Condition never
# fires.

name = "Minimal"
hook_title = "One ball, one bounce at a time"
time_cap = 10.0

[arena]
radius = 460.0

[ball]
radius = 30.0
speed = 900.0

# Nothing grows, so the ball never fills the Arena.
[end_condition]
kind = "arena_filled"

[meta]
title = "{hook_title}"
description = "One ball, a circle, and a note on every bounce: {boundary_hits} of them."
hashtags = ["bounce", "relaxing"]
