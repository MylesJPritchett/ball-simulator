# Every bounce changes colour: one ball falls under gravity and takes the
# next palette colour on every Boundary Hit, speeding up a touch each time.

name = "Changing colour"
hook_title = "Every bounce changes its colour"
time_cap = { min = 28.0, max = 38.0 }

[arena]
radius = 460.0

[ball]
radius = { min = 50.0, max = 65.0 }
speed = { min = 700.0, max = 900.0 }
max_speed = 3500.0

[[rules]]
kind = "gravity"
strength = { min = 700.0, max = 1100.0 }

[[rules]]
kind = "speed_up"
percent = { min = 2.0, max = 3.0 }

[[rules]]
kind = "change_colour"

[end_condition]
kind = "time_cap"

# Notes follow where it lands on the Boundary.
[sound]
pitch_mode = "angle"

[look]
glow = true
trails = true

# Seeds outside these are rejected and replaced. Durations are Video length
# in seconds (action plus the ~1.5 s ending hold).
[quality_gate]
min_duration = 28.0
max_duration = 45.0
min_boundary_hits = 40
