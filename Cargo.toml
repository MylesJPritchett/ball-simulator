[package]
name = "ball-simulator"
version = "0.1.0"
edition = "2021"
description = "Generates satisfying ball-bounce Videos from Scenarios and Seeds"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
toml = "0.8"

# Rendering 1080x1920 frames is slow unoptimised; keep dependencies fast in dev/test.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
