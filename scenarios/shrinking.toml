# It shrinks every bounce: one big ball gets smaller (and a little faster)
# on every Boundary Hit, and its note climbs as it shrinks.

name = "Shrinking"
hook_title = "It shrinks every bounce"
time_cap = { min = 30.0, max = 40.0 }

[arena]
radius = 460.0

[ball]
radius = { min = 280.0, max = 320.0 }
speed = { min = 600.0, max = 750.0 }
max_speed = 3000.0

[[rules]]
kind = "shrink"
amount = { min = 4.0, max = 6.0 }
min_radius = 6.0

[[rules]]
kind = "speed_up"
percent = { min = 1.5, max = 2.5 }

[end_condition]
kind = "time_cap"

# Smaller ball, higher note.
[sound]
pitch_mode = "ball_size"

# Seeds outside these are rejected and replaced. Durations are Video length
# in seconds (action plus the ~1.5 s ending hold).
[quality_gate]
min_duration = 30.0
max_duration = 45.0
min_boundary_hits = 55

[meta]
title = "It shrinks every bounce - how small can it get?"
description = "A ball {ball.radius} units wide shrinks by {rules[0].amount} on every Boundary Hit, and its note climbs as it goes. {boundary_hits} bounces."
hashtags = ["shrinking", "tiny"]
