# One ball that gets faster and changes colour on every Boundary Hit,
# up to the max speed.

name = "Faster every bounce"
hook_title = "It gets faster every bounce"
time_cap = 20.0

[arena]
radius = 460.0

[ball]
radius = 30.0
speed = 900.0
max_speed = 4000.0

[[rules]]
kind = "speed_up"
percent = 8.0

[[rules]]
kind = "change_colour"

[end_condition]
kind = "time_cap"

# Seeds outside these are rejected and replaced. Durations are Video length
# in seconds (action plus the ~1.5 s ending hold).
[quality_gate]
min_duration = 20.0
max_duration = 22.0
min_boundary_hits = 40

[meta]
title = "It gets {rules[0].percent}% faster every bounce"
description = "Every Boundary Hit speeds the ball up by {rules[0].percent}% and changes its colour. {boundary_hits} bounces in {duration} seconds."
hashtags = ["speed", "faster", "acceleration"]
